---
AWSTemplateFormatVersion: '2010-09-09'
Description: True 1-Click Deployment of Microcks on Amazon EKS with Aurora PostgreSQL and DocumentDB.

Parameters:
  ClusterName:
    Type: String
    Default: microcks-cluster
    Description: Name of the EKS cluster
  KubernetesVersion:
    Type: String
    Default: '1.32'
    Description: Kubernetes version for EKS
  NodeInstanceType:
    Type: String
    Default: t3.medium
    Description: Instance type for EKS node group
    AllowedValues: [t3.medium, t3.large, m5.large, m5.xlarge]
  NodeGroupName:
    Type: String
    Default: microcks-nodes
  DesiredCapacity:
    Type: Number
    Default: 2
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 3
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for EKS and Aurora. Must span at least two Availability Zones.
  DocDBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for DocumentDB. Must span at least two Availability Zones.
  AuroraEngineVersion:
    Type: String
    Default: '15.5'
  DocDBEngineVersion:
    Type: String
    Default: '5.0'
  VpcSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for the VPC
  AuroraMasterUsername:
    Type: String
    Default: microcks
  AuroraMasterPassword:
    Type: String
    NoEcho: true
  DocDBMasterUsername:
    Type: String
    Default: microcks
  DocDBMasterPassword:
    Type: String
    NoEcho: true
  MicrocksDomain:
    Type: String
    Default: microcks.example.com
    Description: Domain for Microcks

Resources:
  # ---------------------------------------------------------
  # 1. EKS Infrastructure
  # ---------------------------------------------------------
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref VpcSecurityGroupId

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      NodegroupName: !Ref NodeGroupName
      ClusterName: !Ref ClusterName
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets: !Ref SubnetIds
      ScalingConfig:
        DesiredSize: !Ref DesiredCapacity
        MinSize: !Ref MinSize
        MaxSize: !Ref MaxSize
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: AL2_x86_64
      DiskSize: 20

  # ---------------------------------------------------------
  # 2. Database Infrastructure
  # ---------------------------------------------------------
  MicrocksDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Microcks Aurora
      SubnetIds: !Ref SubnetIds

  MicrocksDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: microcks-db-cluster
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      Port: 5432
      MasterUsername: !Ref AuroraMasterUsername
      MasterUserPassword: !Ref AuroraMasterPassword
      DBSubnetGroupName: !Ref MicrocksDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref VpcSecurityGroupId
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2
      EnableHttpEndpoint: true
      DeletionProtection: false

  MicrocksDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: microcks-db-instance
      DBClusterIdentifier: !Ref MicrocksDBCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless

  MicrocksDocDBSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for DocumentDB
      SubnetIds: !Ref DocDBSubnetIds

  MicrocksDocDBCluster:
    Type: AWS::DocDB::DBCluster
    Properties:
      DBClusterIdentifier: microcks-docdb-cluster
      EngineVersion: !Ref DocDBEngineVersion
      MasterUsername: !Ref DocDBMasterUsername
      MasterUserPassword: !Ref DocDBMasterPassword
      DBSubnetGroupName: !Ref MicrocksDocDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref VpcSecurityGroupId
      DeletionProtection: false

  MicrocksDocDBInstance:
    Type: AWS::DocDB::DBInstance
    DependsOn:
      - MicrocksDocDBCluster
      - MicrocksDocDBSubnetGroup
    Properties:
      DBInstanceIdentifier: microcks-docdb-instance
      DBClusterIdentifier: !Ref MicrocksDocDBCluster
      DBInstanceClass: db.t3.medium

  # ---------------------------------------------------------
  # 3. 1-Click CodeBuild Deployment
  # ---------------------------------------------------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonVPCFullAccess

  CodeBuildEksAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt CodeBuildRole.Arn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  DeployMicrocksProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub DeployMicrocks-${AWS::StackName}
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: CLUSTER_NAME
            Value: !Ref ClusterName
          - Name: REGION
            Value: !Ref AWS::Region
          - Name: MICROCKS_DOMAIN
            Value: !Ref MicrocksDomain
          - Name: AURORA_ENDPOINT
            Value: !GetAtt MicrocksDBCluster.Endpoint.Address
          - Name: AURORA_USER
            Value: !Ref AuroraMasterUsername
          - Name: AURORA_PASS
            Value: !Ref AuroraMasterPassword
          - Name: DOCDB_ENDPOINT
            Value: !GetAtt MicrocksDocDBCluster.Endpoint
          - Name: DOCDB_USER
            Value: !Ref DocDBMasterUsername
          - Name: DOCDB_PASS
            Value: !Ref DocDBMasterPassword
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              commands:
                - curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.0/2024-05-12/bin/linux/amd64/kubectl
                - chmod +x ./kubectl
                - mv ./kubectl /usr/local/bin
                - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
                - chmod 700 get_helm.sh
                - ./get_helm.sh
            build:
              commands:
                - aws eks update-kubeconfig --name $CLUSTER_NAME --region $REGION
                - kubectl create namespace microcks || true
                - kubectl create namespace keycloak || true
                - kubectl create namespace ingress-nginx || true
                
                # 1. Initialize DocumentDB from inside the cluster
                - |
                  cat <<EOF > init-docdb-job.yaml
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: init-documentdb
                    namespace: microcks
                  spec:
                    template:
                      spec:
                        containers:
                        - name: mongo
                          image: mongo:5.0
                          command: ["/bin/sh", "-c"]
                          args:
                            - |
                              wget https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
                              mongo --host $DOCDB_ENDPOINT --port 27017 -u $DOCDB_USER -p $DOCDB_PASS --tls --tlsCAFile global-bundle.pem --authenticationDatabase admin admin --eval 'db.getSiblingDB("microcks").createCollection("services"); db.getSiblingDB("microcks").createCollection("operations"); db.getSiblingDB("microcks").createCollection("responses"); db.getSiblingDB("microcks").createCollection("requests"); db.getSiblingDB("microcks").createCollection("tests"); db.getSiblingDB("microcks").createCollection("jobs"); db.getSiblingDB("microcks").createCollection("events"); db.getSiblingDB("microcks").createCollection("imports"); db.getSiblingDB("microcks").createCollection("snapshots"); db.getSiblingDB("microcks").createCollection("metadata"); db.getSiblingDB("microcks").createCollection("users"); db.getSiblingDB("microcks").createCollection("roles"); db.getSiblingDB("microcks").createCollection("serviceState");'
                        restartPolicy: Never
                  EOF
                - kubectl apply -f init-docdb-job.yaml
                - kubectl wait --for=condition=complete job/init-documentdb -n microcks --timeout=300s
                
                # 2. Deploy Ingress & Cert-Manager
                - helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                - helm repo add jetstack https://charts.jetstack.io
                - helm repo update
                - helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --set controller.service.type=LoadBalancer
                - helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set installCRDs=true
                
                # 3. Deploy Keycloak
                - helm repo add bitnami https://charts.bitnami.com/bitnami
                - |
                  cat <<EOF > keycloak-values.yaml
                  externalDatabase:
                    host: "$AURORA_ENDPOINT"
                    port: 5432
                    database: "postgres"
                    user: "$AURORA_USER"
                    password: "$AURORA_PASS"
                  auth:
                    adminUser: admin
                    adminPassword: adminpassword
                  EOF
                - helm install keycloak bitnami/keycloak -f keycloak-values.yaml -n keycloak
                
                # 4. Deploy Microcks
                - wget https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
                - kubectl create secret generic documentdb-ca-bundle --from-file=global-bundle.pem -n microcks || true
                - kubectl create secret generic microcks-mongodb-connection -n microcks --from-literal=username=$DOCDB_USER --from-literal=password=$DOCDB_PASS || true
                - helm repo add microcks https://microcks.io/helm/
                - |
                  cat <<EOF > microcks-values.yaml
                  microcks:
                    url: microcks.$MICROCKS_DOMAIN
                    extraVolumeMounts:
                      - name: documentdb-ca
                        mountPath: "/certs"
                        readOnly: true
                    extraVolumes:
                      - name: documentdb-ca
                        secret:
                          secretName: documentdb-ca-bundle
                  keycloak:
                    enabled: true
                    install: false
                    url: keycloak.$MICROCKS_DOMAIN
                    privateUrl: http://keycloak.keycloak.svc.cluster.local:80
                  mongodb:
                    install: false
                    uri: mongodb://$DOCDB_ENDPOINT:27017/microcks
                    uriParameters: "?authSource=admin&tls=true&tlsCAFile=/certs/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
                    database: microcks
                    secretRef:
                      secret: microcks-mongodb-connection
                      usernameKey: username
                      passwordKey: password
                  ingress:
                    enabled: true
                    ingressClassName: nginx
                    hostname: microcks.$MICROCKS_DOMAIN
                    annotations:
                      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
                    tls: false
                  EOF
                - helm install microcks microcks/microcks -n microcks -f microcks-values.yaml

  TriggerCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DeployMicrocksProject.Arn

  TriggerCodeBuildLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.9
      Timeout: 900
      Role: !GetAtt TriggerCodeBuildRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref DeployMicrocksProject
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import os

          def handler(event, context):
              if event['RequestType'] in ['Create', 'Update']:
                  try:
                      cb = boto3.client('codebuild')
                      project_name = os.environ['PROJECT_NAME']
                      build = cb.start_build(projectName=project_name)
                      build_id = build['build']['id']
                      
                      while True:
                          time.sleep(10)
                          status = cb.batch_get_builds(ids=[build_id])['builds'][0]['buildStatus']
                          if status == 'SUCCEEDED':
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                              return
                          elif status in ['FAILED', 'FAULT', 'STOPPED', 'TIMED_OUT']:
                              cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": f"CodeBuild failed with status {status}"})
                              return
                  except Exception as e:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  RunDeployment:
    Type: Custom::RunCodeBuild
    DependsOn:
      - NodeGroup
      - MicrocksDocDBInstance
      - MicrocksDBInstance
      - CodeBuildEksAccess
    Properties:
      ServiceToken: !GetAtt TriggerCodeBuildLambda.Arn
      Version: "1.0"

Outputs:
  EKSClusterName:
    Description: Name of the EKS cluster
    Value: !Ref ClusterName
  AuroraEndpoint:
    Description: Endpoint of the Aurora PostgreSQL cluster
    Value: !GetAtt MicrocksDBCluster.Endpoint.Address
  DocumentDBEndpoint:
    Description: Endpoint of the DocumentDB cluster
    Value: !GetAtt MicrocksDocDBCluster.Endpoint
  MicrocksURL:
    Description: Domain to access Microcks
    Value: !Sub https://microcks.${MicrocksDomain}
